<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Wall Clock | code with divinity</title>
<link rel="stylesheet" href="wall-clock.css">
</head>

<body>

<div class="clock-frame">
    <div class="clock">
        <div class="brand">
            ＤＩＶＩＮＩＴＹ
        </div>

        <div class="brand-line"></div>

        <!-- Numbers generated by JavaScript -->
        <div class="numbers" id="numbers"></div>

        <!-- Tick marks generated by JavaScript -->
        <div class="ticks" id="ticks"></div>

        <!-- Clock hands -->
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>

        <!-- Center -->
        <div class="center-pin"></div>

        <!-- Digital -->
        <div class="digital">

            <div
                class="digital-time"
                id="digitalTime">
                00:00:00
            </div>

            <div
                class="date"
                id="date">
                ---
            </div>

        </div>

        <!-- Status -->
        <div class="status-dot"></div>
    </div>
</div>

  <script src="wall-clock.js" defer></script>
</body>
</html>
